services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plate
      POSTGRES_PASSWORD: plate_local
      POSTGRES_DB: plate
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plate -d plate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
